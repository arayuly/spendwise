[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { version = "0.8.22", features = ["csr"] }
spendwise_shared = { path = "../shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
rust_decimal = { version = "1", features = ["serde-str"] }
uuid = { version = "1", features = ["serde"] }
gloo-net = "0.6"
async-lock = "3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlAnchorElement", "HtmlDialogElement", "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "History", "Location", "Storage", "MediaQueryList", "Event", "EventTarget", "KeyboardEvent", "RequestCredentials", "Blob", "Url"] }
