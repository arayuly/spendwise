name: spendwise

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: spendwise
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      SPENDWISE_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-spendwise.sh:ro
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d spendwise"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  app:
    image: spendwise:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://spendwise:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/spendwise
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      HOST: 0.0.0.0
      PORT: 8080
      FRONTEND_DIR: /app/public
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-10}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-10}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-20}
      RUST_LOG: ${RUST_LOG:-backend=info,tower_http=info}
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - database
      - web
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  database:
    internal: true
  web:
