[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.54.0", features = ["full"] }
spendwise_shared = { path = "../shared", features = ["server"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "rust_decimal", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde-str"] }
argon2 = "0.5"
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"] }
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
subtle = "2"
validator = { version = "0.20", features = ["derive"] }
thiserror = "2"
tower = { version = "0.5", features = ["util", "limit"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "timeout", "limit", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
url = "2"
csv = "1"
futures-util = "0.3"

[dev-dependencies]
http-body-util = "0.1"
