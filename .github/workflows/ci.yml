name: SpendWise CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: spendwise_test
          POSTGRES_PASSWORD: isolated_ci_test_password
          POSTGRES_DB: spendwise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U spendwise_test -d spendwise_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://spendwise_test:isolated_ci_test_password@localhost:5432/spendwise_test
      APP_ENV: test
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Format
        run: cargo fmt --all --check
      - name: OpenAPI contract is synchronized
        run: |
          python scripts/generate_openapi.py
          git diff --exit-code -- docs/openapi.json
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unit and PostgreSQL integration tests
        run: cargo test --workspace --locked
      - name: Backend release
        run: cargo build --release --locked -p backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Install Trunk
        run: cargo install trunk --version 0.21.14 --locked
      - name: Install locked Tailwind v4 dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit Tailwind build dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Build minified Tailwind CSS
        working-directory: frontend
        run: npm run css:build
      - name: Compile frontend WASM
        run: cargo check --locked -p frontend --target wasm32-unknown-unknown
      - name: Lint frontend WASM
        run: cargo clippy --locked -p frontend --target wasm32-unknown-unknown -- -D warnings
      - name: Bundle frontend
        working-directory: frontend
        run: trunk build --release --locked
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          tags: spendwise:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
